<style>
*{box-sizing:border-box}
html,body{height:100%;width:100%;margin:0;background:#040609;color:#e8f3f8;font-family:'Space Grotesk',system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
body{overscroll-behavior:none}
#map-bg-scan{position:fixed;inset:0;z-index:0;pointer-events:none;background:#050810;background-image:linear-gradient(rgba(11,211,211,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(11,211,211,.045) 1px,transparent 1px);background-size:48px 48px}
#map{position:fixed!important;inset:0 0 var(--tm-dock-h,76px) 0!important;z-index:1;background:transparent!important}
.maplibregl-canvas{background:transparent!important}
#legacy-controls{display:none!important}
/* #status is the live feedback line (transport/camera/weather/source status). It used to be
   force-hidden with no way to ever show it again — every setStatus() call across the app was
   silently going nowhere. Give it real, minimal styling and let the existing .tm-show class
   (already toggled by setStatus() in several files) control visibility. */
#status{position:fixed;z-index:4500;left:12px;top:52px;max-width:min(560px,calc(100vw - 24px));padding:6px 10px;border:1px solid rgba(150,190,220,.18);border-radius:7px;background:rgba(5,10,16,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:10px;line-height:1.4;color:#cfe3ee;opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .25s ease,transform .25s ease;pointer-events:none}
#status.tm-show{opacity:1;visibility:visible;transform:translateY(0)}
/* Bottom command dock is the primary TrackMeNow navigation workspace. Keep it visible. */
#tm-shell{display:block!important;visibility:visible!important;opacity:1!important;position:fixed!important;left:0!important;right:0!important;bottom:0!important;pointer-events:auto!important;}
#tm-main-tabs,#tm-subbar{visibility:visible!important;opacity:1!important;}
#tm-timebar{bottom:calc(var(--tm-dock-h,76px) + 10px)!important;z-index:5000!important}
#tm-shell{z-index:999999!important;display:block!important;visibility:visible!important;opacity:1!important}
#tm-panel.open{z-index:6100!important}
#tm-time-slider{accent-color:#45a8ff}
/* Boot/landing: an instrument acquiring signal, not an app loading screen. Asymmetric
   lower-left HUD readout over the same live-grid motif used behind the map itself, one
   horizontal sweep for motion, a real ticking clock and scanning coordinate for texture. */
#tm-boot{position:fixed;inset:0;z-index:20000;background:#040609;color:#e8f3f8;transition:opacity .6s ease,visibility .6s ease;overflow:hidden}
#tm-boot.ready{opacity:0;visibility:hidden;pointer-events:none}
.tm-boot-grid{position:absolute;inset:-2px;background-image:linear-gradient(rgba(95,212,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(95,212,255,.05) 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(ellipse 85% 75% at 28% 68%,#000 0%,transparent 72%)}
.tm-boot-sweep{position:absolute;left:0;right:0;height:140px;background:linear-gradient(180deg,transparent,rgba(95,212,255,.07) 48%,transparent);animation:tmSweep 3.2s cubic-bezier(.4,0,.2,1) infinite}
.tm-boot-hud{position:absolute;left:28px;bottom:14%;max-width:min(420px,calc(100vw - 56px))}
.tm-boot-mark{font-size:26px;font-weight:700;letter-spacing:.5px;line-height:1}
.tm-boot-tag{margin-top:7px;font-size:13px;font-weight:400;color:#7d93a3}
.tm-boot-readout{margin-top:26px;display:flex;flex-direction:column;gap:3px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:#5fd4ff;letter-spacing:.2px}
.tm-boot-status{margin-top:14px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.4px;color:#9fb4c2;min-height:13px}
.tm-boot-bar{margin-top:16px;width:230px;height:1px;background:rgba(170,205,225,.16);position:relative;overflow:hidden}
.tm-boot-bar i{position:absolute;inset:0 100% 0 0;background:#5fd4ff;box-shadow:0 0 8px rgba(95,212,255,.6);animation:tmBarFill 2.6s cubic-bezier(.4,0,.2,1) infinite}
@keyframes tmSweep{0%{top:-140px}70%{top:100%}100%{top:100%}}
@keyframes tmBarFill{0%{right:100%}65%{right:4%}100%{right:4%}}
@media(max-width:640px){.tm-boot-hud{left:18px;bottom:16%}.tm-boot-mark{font-size:21px}.tm-boot-bar{width:calc(100vw - 90px);max-width:230px}}
@media(max-width:800px){#status.tm-show{left:6px;top:52px;max-width:calc(100vw - 12px)}}
</style>
</head>
<body>
<div id="tm-boot" aria-live="polite">
  <div class="tm-boot-grid" aria-hidden="true"></div>
  <div class="tm-boot-sweep" aria-hidden="true"></div>
  <div class="tm-boot-hud">
    <div class="tm-boot-mark">TrackMeNow</div>
    <div class="tm-boot-tag">Live global intelligence</div>
    <div class="tm-boot-readout">
      <span id="tm-boot-coord">00.0000&deg;N&nbsp;&nbsp;000.0000&deg;E</span>
      <span id="tm-boot-clock">00:00:00 UTC</span>
    </div>
    <div class="tm-boot-status" id="tm-boot-status">ACQUIRING SIGNAL</div>
    <div class="tm-boot-bar"><i></i></div>
  </div>
</div>
<div id="map-bg-scan" aria-hidden="true"></div>
<div id="map"></div>
<div id="legacy-controls"></div>
<div id="status">Starting…</div>
<div id="tm-shell" aria-label="TrackMeNow navigation"><nav id="tm-main-tabs"><button class="tm-tab" type="button">MAP</button><button class="tm-tab" type="button">SPACE</button><button class="tm-tab" type="button">TRANSIT</button><button class="tm-tab" type="button">WEATHER</button><button class="tm-tab" type="button">COMMUNICATION</button><button class="tm-tab" type="button">TRACK</button><button class="tm-tab" type="button">VISUALS</button><button class="tm-tab" type="button">MORE</button></nav><div id="tm-subbar"><button class="tm-sub active" type="button">OVERVIEW</button></div><div class="tm-zoom-common"></div><section id="tm-panel"><div class="tm-panel-head"><div id="tm-panel-title" class="tm-panel-title">MAP / OVERVIEW</div><div class="tm-panel-meta">LIVE / PUBLIC / CONSENT-BASED</div><button class="tm-close" type="button">×</button></div></section></div>
<script>
window.TM_API_BASE='https://wispy-bush-9aee.recreationeeraj.workers.dev';
window.TM_MOVEMENT_API_BASE=window.TM_API_BASE;
window.TM_CAMERA_CATALOGUE_URL='https://raw.githubusercontent.com/connectingprofessional/trackmenow/live-data/cameras.json';
/* SINGLE GOOGLE MAPS PLATFORM KEY
   TrackMeNow deliberately uses ONE browser key for the entire Google Earth workspace:
   Maps JavaScript API, Map Tiles API (2D + Photorealistic 3D), Street View and related
   Google Maps features enabled for the same Google Cloud project.
   The deployed key is resolved from the secure Worker /api/google/maps-config endpoint.
   Keep the published value blank; never commit the credential to GitHub. */
window.TM_GOOGLE_MAPS_API_KEY='';
window.TM_GOOGLE_MAPS_3D_API_KEY=window.TM_GOOGLE_MAPS_API_KEY;
window.setTimeout(function(){var b=document.getElementById('tm-boot');if(b&&!b.classList.contains('ready'))b.classList.add('ready');},12000);
(function(){
  // Boot-screen telemetry: a ticking UTC clock, a coordinate that scans across a handful of
  // real cities (as if sweeping for signal), and status text that names one live source at a
  // time. Purely cosmetic — stops the moment trackmenow.js marks the boot screen ready.
  var boot=document.getElementById('tm-boot');
  var coordEl=document.getElementById('tm-boot-coord');
  var clockEl=document.getElementById('tm-boot-clock');
  var statusEl=document.getElementById('tm-boot-status');
  var spots=[[28.6139,77.2090],[51.4700,-0.4543],[40.6413,-73.7781],[35.5494,139.7798],[-33.9461,151.1772],[1.3644,103.9915],[25.2532,55.3657]];
  var sources=['ADS-B AIRCRAFT','AIS VESSEL TRACKING','GTFS-REALTIME TRANSIT','OPENSTREETMAP CAMERAS','CELL TOWER REGISTRY'];
  var i=0;
  function pad(n){return String(n).padStart(2,'0');}
  function tick(){
    if(!boot||boot.classList.contains('ready')){clearInterval(timer);return;}
    var now=new Date();
    if(clockEl)clockEl.textContent=pad(now.getUTCHours())+':'+pad(now.getUTCMinutes())+':'+pad(now.getUTCSeconds())+' UTC';
    var s=spots[i%spots.length];
    if(coordEl)coordEl.textContent=Math.abs(s[0]).toFixed(4)+'°'+(s[0]>=0?'N':'S')+'  '+Math.abs(s[1]).toFixed(4)+'°'+(s[1]>=0?'E':'W');
    if(statusEl)statusEl.textContent='ACQUIRING · '+sources[i%sources.length];
    i++;
  }
  tick();
  var timer=setInterval(tick,1100);
})();
</script>
