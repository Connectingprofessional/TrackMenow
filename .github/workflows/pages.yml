name: Deploy TrackMeNow to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: trackmenow-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Makes secrets stored in the existing github-pages environment available during build-time injection.
    environment:
      name: github-pages
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static TrackMeNow site
        shell: bash
        env:
          # Accept any one of the existing Google key names and publish the same browser key to both runtime variables.
          TM_GOOGLE_MAPS_3D_API_KEY: ${{ secrets.TM_GOOGLE_MAPS_3D_API_KEY || secrets.TM_GOOGLE_MAPS_API_KEY || secrets.GOOGLE_MAPS_API_KEY || secrets.GOOGLE_MAP_API_KEY || vars.TM_GOOGLE_MAPS_3D_API_KEY || vars.TM_GOOGLE_MAPS_API_KEY || vars.GOOGLE_MAPS_API_KEY || vars.GOOGLE_MAP_API_KEY }}
          TM_GOOGLE_MAPS_API_KEY: ${{ secrets.TM_GOOGLE_MAPS_3D_API_KEY || secrets.TM_GOOGLE_MAPS_API_KEY || secrets.GOOGLE_MAPS_API_KEY || secrets.GOOGLE_MAP_API_KEY || vars.TM_GOOGLE_MAPS_3D_API_KEY || vars.TM_GOOGLE_MAPS_API_KEY || vars.GOOGLE_MAPS_API_KEY || vars.GOOGLE_MAP_API_KEY }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/vendor/maplibre-gl

          # Parse-check the browser scripts before anything is published.
          for f in *.js; do
            case "$f" in
              vendor/*) continue ;;
            esac
            node --check "$f"
          done

          cp index.html _site/index.html
          # Inject keys at build time, keeping them out of public source control.
          # TM_GOOGLE_MAPS_API_KEY can be a separate Embed API key; if absent, reuse the 3D key.
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          target = Path("_site/index.html")
          html = target.read_text(encoding="utf-8")
          primary = (os.environ.get("TM_GOOGLE_MAPS_API_KEY", "") or os.environ.get("TM_GOOGLE_MAPS_3D_API_KEY", "")).strip()
          if not primary:
              raise SystemExit(
                  "Google Maps key injection failed: no key found. Add GOOGLE_MAPS_API_KEY, TM_GOOGLE_MAPS_API_KEY, "
                  "or TM_GOOGLE_MAPS_3D_API_KEY as a GitHub Actions repository secret or github-pages environment variable."
              )
          # TrackMeNow uses ONE Google Maps Platform browser key for the complete Earth workspace.
          # Inject only the canonical API-key variable; index.html derives the 3D variable from it.
          marker = "window.TM_GOOGLE_MAPS_API_KEY='';"
          if marker not in html:
              raise SystemExit("TM_GOOGLE_MAPS_API_KEY placeholder not found in index.html")
          html = html.replace(marker, "window.TM_GOOGLE_MAPS_API_KEY=" + json.dumps(primary) + ";", 1)
          if "window.TM_GOOGLE_MAPS_API_KEY=''" in html:
              raise SystemExit("TM_GOOGLE_MAPS_API_KEY remained empty after injection")
          target.write_text(html, encoding="utf-8")
          print("Google Maps key injection verified for both browser configuration variables.")
          PY
          # Copy every top-level JS/CSS/HTML file automatically so a new file added in any
          # session is deployed without anyone having to remember to list it here by name.
          # This replaced a hand-maintained cp list that silently dropped new files (e.g.
          # trackmenow-google-map-tiles.js shipped referenced from index.html but 404ing on
          # the live site because it was never added to this list).
          for f in *.js *.css *.html; do
            case "$f" in
              index.html) continue ;;
              '*.js'|'*.css'|'*.html') continue ;; # no matches for that glob
            esac
            cp "$f" "_site/$f"
          done
          mkdir -p _site/data
          if [ -f data/nasa.json ]; then cp data/nasa.json _site/data/nasa.json; fi
          cp -r vendor/maplibre-gl/. _site/vendor/maplibre-gl/

          test -s _site/index.html
          test -s _site/visuals-ui.js
          test -s _site/visuals.css
          test -s _site/trackmenow.js
          test -s _site/vendor/maplibre-gl/maplibre-gl.js

          # Hard guardrail: every local ./*.js or ./*.css file index.html actually references
          # must exist in the published _site, or the deploy fails loudly here instead of
          # shipping a silent 404 that breaks a feature on the live site.
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          html = Path("_site/index.html").read_text(encoding="utf-8")
          refs = re.findall(r'(?:src|href)="\./([^"?]+)(?:\?[^"]*)?"', html)
          missing = [r for r in sorted(set(refs)) if not Path("_site", r).is_file()]
          if missing:
              print("Missing files referenced by index.html:", missing, file=sys.stderr)
              sys.exit(1)
          print("All", len(set(refs)), "local files referenced by index.html are present in _site.")
          PY

          echo "TrackMeNow Pages artifact:"
          find _site -maxdepth 2 -type f | sort

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy TrackMeNow
        id: deployment
        uses: actions/deploy-pages@v4
